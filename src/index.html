<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Product cards</title>
    <link
      rel="stylesheet"
      href="./styles/index.scss"
    />
  </head>
  <body>
    <div
      class="card"
      data-qa="card"
    >
      <img
        src="./images/imac.jpeg"
        alt="imac-img"
        class="card__imac-image"
      />

      <div class="card__information">
        <h1 class="card__name">
          APPLE A1419 iMac 27" Retina 5K Monoblock (MNED2UA/A)
        </h1>
        <h2 class="card__code">Product code: 195434</h2>

        <div class="card__rating">
          <div class="card__stars">
            <div class="card__star card__star--active"></div>
            <div class="card__star card__star--active"></div>
            <div class="card__star card__star--active"></div>
            <div class="card__star card__star--active"></div>
            <div class="card__star"></div>
          </div>
          <h2 class="card__review">Reviews: 5</h2>
        </div>

        <div class="card__value">
          <p class="card__price">Price:</p>
          <h2 class="card__cost">$2,199</h2>
        </div>
        <button
          class="card__button"
          data-qa="hover"
        >
          Buy
        </button>
      </div>
    </div>
  </body>
</html>
